# Managed by personal-rules (v0.3.1); /personal-rules:check compares it with the template. The
# build is this repository's own build.yml, in place of the shared cpp-release.yml.
name: Release

# Pushing a tag vX.Y.Z (or vX.Y.Z-rc.N, a prerelease) checks it, builds the Windows setup, the
# macOS disk image and the Linux .deb package, and publishes the GitHub release. The tag gives the
# version. The build jobs hold no signing secrets: on macOS, a separate job signs and notarises the
# disk image with the Developer ID, from the secrets of the environment "release". To redo a
# failed run, re-run its failed jobs, or run this workflow by hand from its tag.
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # The tag is vX.Y.Z or a prerelease, and on master. The build passes the tag's version to CMake
  # (IEC_VERSION), so no manifest is compared.
  check:
    if: github.ref_type == 'tag'
    uses: RangelReale/personal-ai-rules/.github/workflows/release-check.yml@v0.3.1

  build:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      release-tag: ${{ needs.check.outputs.tag }}
      macos-signing: developer-id
    # The build jobs read the Google client; only the signing job reads the signing secrets.
    secrets: inherit

  # Attaches the release-* artifacts with a SHA256SUMS.txt; the notes are the version's section of
  # CHANGELOG.md.
  publish:
    needs: [check, build]
    permissions:
      contents: write
    uses: RangelReale/personal-ai-rules/.github/workflows/release-publish.yml@v0.3.1
    with:
      tag: ${{ needs.check.outputs.tag }}
      version: ${{ needs.check.outputs.version }}
      prerelease: ${{ needs.check.outputs.prerelease }}
      title: Icon Email Check ${{ needs.check.outputs.tag }}
