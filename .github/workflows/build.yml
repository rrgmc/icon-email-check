# Builds, tests and packages the app on Windows, macOS and Linux. ci.yml calls
# it for every change, and release.yml for a tag:
#
#   jobs:
#     build:
#       uses: ./.github/workflows/build.yml
#       with:
#         release-tag: ${{ github.ref_name }}   # gives the version
#         macos-signing: developer-id           # sign and notarise
#       secrets: inherit
#
# The build jobs hold only the Google OAuth client, which the app needs at
# build time and which ships inside it anyway. On macOS, the build job makes
# the disk image itself, signed ad hoc, unless macos-signing is developer-id.
# Then a separate job signs the finished bundle with the Developer ID and
# makes the disk image; it runs nothing from the build, and only it reads the
# signing secrets. The packages are the artifacts icon-email-check-<OS>.

name: Build

on:
  workflow_call:
    inputs:
      release-tag:
        description: Build for this tag, vX.Y.Z or vX.Y.Z-rc.N, which gives the version. Empty builds the version in CMakeLists.txt
        type: string
        default: ''
      macos-signing:
        description: none signs ad hoc. developer-id signs and notarises with the secrets of the environment "release", or signs ad hoc with a warning when they are missing
        type: string
        default: none
    secrets:
      IEC_GOOGLE_CLIENT_ID:
        description: The Google OAuth client ID to build in. Without it, the app has no built-in client
        required: false
      IEC_GOOGLE_CLIENT_SECRET:
        description: That client's secret
        required: false
      # The signing job reads these from the environment "release".
      MACOS_CERTIFICATE_P12:
        description: The Developer ID Application certificate and key, as a base64 .p12 file
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        description: The password of that .p12 file
        required: false
      NOTARY_API_KEY:
        description: An App Store Connect API key, the contents of its .p8 file
        required: false
      NOTARY_API_KEY_ID:
        description: That key's ID
        required: false
      NOTARY_API_ISSUER:
        description: That key's issuer ID
        required: false
    outputs:
      version:
        description: The version this run built
        value: ${{ jobs.prepare.outputs.version }}

permissions:
  contents: read

env:
  QT_VERSION: 6.8.3
  CTEST_PARALLEL_LEVEL: 4

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        env:
          TAG: ${{ inputs.release-tag }}
        run: |
          if [ -z "$TAG" ]; then
            version=$(sed -nE 's/^set\(IEC_VERSION "([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' CMakeLists.txt | head -n 1)
            if [ -z "$version" ]; then
              echo "::error::CMakeLists.txt sets no IEC_VERSION \"X.Y.Z\"."
              exit 1
            fi
          elif [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-rc\.[0-9]+)?$ ]]; then
            version=${BASH_REMATCH[1]}
          else
            echo "::error::Release tag '$TAG' is not vX.Y.Z or vX.Y.Z-rc.N."
            exit 1
          fi
          echo "Building version $version."
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-24.04]
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # CMake reads these at configure time. A pull request from a fork gets
      # no secrets, and builds without a client.
      IEC_GOOGLE_CLIENT_ID: ${{ secrets.IEC_GOOGLE_CLIENT_ID }}
      IEC_GOOGLE_CLIENT_SECRET: ${{ secrets.IEC_GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # uv only runs aqtinstall. There are no Python dependencies to cache.
          enable-cache: false

      - name: Cache Qt
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/qt
          # Change the fixed part when setup-qt installs other archives.
          key: qt-${{ runner.os }}-${{ env.QT_VERSION }}-qtbase-qtsvg-icu

      # CMakeLists.txt compiles through ccache when it finds it. Only pushes
      # save the cache: a pull request's cache is visible to that pull request
      # only, and would push master's out of the 10 GB limit.
      - name: Cache compiling
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ matrix.os }}-ci
          max-size: 300M
          save: ${{ github.event_name == 'push' }}

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config dpkg-dev libsecret-1-dev libgl1-mesa-dev libegl1 \
            libfontconfig1 libdbus-1-3 libx11-dev libx11-xcb1 libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-util1

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }

      # build.ps1 gets Qt, enters the Visual Studio 2022 developer shell,
      # configures, builds and tests the preset, then installs, checks and
      # packages it.
      - name: Build, test and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          IEC_QT_ROOT: ${{ runner.temp }}/qt
        run: ./tools/build.ps1 -Preset ci -Version "$env:VERSION" -Package

      # Universal on macOS, for Apple silicon and Intel.
      - name: Build and test (macOS, Linux)
        if: runner.os != 'Windows'
        env:
          IEC_QT_ROOT: ${{ runner.temp }}/qt
        run: |
          QT_DIR=$(sh tools/setup-qt.sh)
          if [ "$RUNNER_OS" = macOS ]; then
            set -- "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          else
            set --
          fi
          cmake --preset ci -DCMAKE_PREFIX_PATH="$QT_DIR" -DIEC_VERSION="$VERSION" "$@"
          cmake --build --preset ci
          ctest --preset ci

      - name: Install and check (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          cmake --install build/ci --component App --prefix "$PWD/build/ci/install"
          python3 tools/check-package.py build/ci/install

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cd build/ci && cpack

      # Without the Developer ID, the bundle that the install signed ad hoc
      # goes straight into the disk image, so no second macOS job waits for a
      # runner.
      - name: Make the disk image (macOS)
        if: runner.os == 'macOS' && inputs.macos-signing != 'developer-id'
        run: sh tools/package-macos.sh build/ci/install "build/ci/icon-email-check-$VERSION-macos.dmg"

      # For the signing job. A zip would lose the symbolic links inside Qt's
      # frameworks, so the bundle travels as a tar file.
      - name: Pack the bundle (macOS)
        if: runner.os == 'macOS' && inputs.macos-signing == 'developer-id'
        run: tar -cf build/ci/macos-bundle.tar -C build/ci/install .

      - uses: actions/upload-artifact@v7
        if: runner.os != 'macOS' || inputs.macos-signing != 'developer-id'
        with:
          name: icon-email-check-${{ runner.os }}
          path: |
            build/ci/icon-email-check-*-win64.exe
            build/ci/icon-email-check-*-macos.dmg
            build/ci/icon-email-check_*.deb
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS' && inputs.macos-signing == 'developer-id'
        with:
          name: macos-bundle
          path: build/ci/macos-bundle.tar
          if-no-files-found: error
          retention-days: 1

  # Runs nothing from the build, and reads no cache, so nothing the build ran
  # can reach the certificate. The bundle is data here. Only for the Developer
  # ID; otherwise the build job made the disk image.
  sign-macos:
    needs: [prepare, build]
    if: inputs.macos-signing == 'developer-id'
    runs-on: macos-15
    environment: release
    env:
      SIGNING: ${{ inputs.macos-signing }}
      DMG: icon-email-check-${{ needs.prepare.outputs.version }}-macos.dmg
    steps:
      # Pinned to commits: this job can hold the signing secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-bundle
          path: bundle

      - name: Unpack the bundle
        run: |
          mkdir install
          tar -xf bundle/macos-bundle.tar -C install

      - name: Check the signing secrets
        if: env.SIGNING == 'developer-id'
        env:
          HAS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
          HAS_NOTARY_KEY: ${{ secrets.NOTARY_API_KEY != '' }}
        run: |
          if [ "$HAS_CERTIFICATE" != true ] || [ "$HAS_NOTARY_KEY" != true ]; then
            echo "::warning::The environment \"release\" lacks the Developer ID secrets, so the disk image is signed ad hoc and not notarised. See README.md#releases."
            echo "SIGNING=none" >> "$GITHUB_ENV"
          fi

      # A keychain of its own, with a random password, holds the Developer ID
      # certificate for this job only. The last step deletes it.
      - name: Import the signing certificate
        if: env.SIGNING == 'developer-id'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          echo "::add-mask::$keychain_password"
          umask 077
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          # The existing keychains, one word each, follow the new one.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')

      - name: Sign the bundle and make the disk image
        run: |
          identity=-
          if [ "$SIGNING" = developer-id ]; then
            identity="Developer ID Application"
          fi
          sh tools/sign-macos.sh install/IconEmailCheck.app "$identity"
          sh tools/package-macos.sh install "$DMG"

      - name: Notarise the disk image
        if: env.SIGNING == 'developer-id'
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          IEC_NOTARY_KEY: ${{ runner.temp }}/notary.p8
          IEC_NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          IEC_NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
        run: |
          umask 077
          printf '%s\n' "$NOTARY_API_KEY" > "$IEC_NOTARY_KEY"
          sh tools/notarise-macos.sh "$DMG" "Developer ID Application"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: icon-email-check-macOS
          path: ${{ env.DMG }}
          if-no-files-found: error
          retention-days: 7

      - name: Remove the signing keychain and key
        if: always() && env.SIGNING == 'developer-id'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"
