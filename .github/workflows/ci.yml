# Managed by personal-rules (v0.3.1); /personal-rules:check compares it with the template. The
# build is this repository's own build.yml (it builds in the Google client, checks the packages and
# makes them), in place of the shared cpp-ci.yml.
name: CI

# Pull request runs are titled "PR #<number>: <title>"; an empty run-name keeps GitHub's default.
run-name: >-
  ${{ github.event_name == 'pull_request'
  && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)
  || '' }}

on:
  push:
    branches: [master]
  # labeled/unlabeled: adding the no-changelog label re-runs the changelog check.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on master all finish, since they fill
# the caches that pull requests read.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # docs, version or code, and which parts changed: docs-only and version-only changes skip builds.
  changes:
    uses: RangelReale/personal-ai-rules/.github/workflows/changes.yml@v0.3.1
    with:
      version-files: CMakeLists.txt
      # More paths that never need a build (docs, *.md, .claude/ and editor settings are built in).
      # make-icons.sh regenerates the committed icons by hand; no build runs it.
      ignore: tools/make-icons.sh
      # Pull requests build on Linux only, unless they change code that only Windows or macOS
      # builds: the platform code, packaging and the scripts the other systems run.
      full-paths: >-
        src/platform/ cmake/ CMakeLists.txt resources/app/ tools/build.ps1 tools/setup-qt.ps1
        tools/setup-qt.sh tools/sign-macos.sh tools/package-macos.sh tools/notarise-macos.sh
        tools/check-package.py

  build:
    needs: changes
    if: needs.changes.outputs.main == 'true'
    uses: ./.github/workflows/build.yml
    with:
      full: ${{ needs.changes.outputs.full }}  # all three systems only when it matters
    # Only the Google client, which the app builds in.
    secrets:
      IEC_GOOGLE_CLIENT_ID: ${{ secrets.IEC_GOOGLE_CLIENT_ID }}
      IEC_GOOGLE_CLIENT_SECRET: ${{ secrets.IEC_GOOGLE_CLIENT_SECRET }}

  # Fragments in changelog.d/.
  changelog:
    needs: changes
    if: github.event_name == 'pull_request'
    uses: RangelReale/personal-ai-rules/.github/workflows/changelog-check.yml@v0.3.1
    with:
      kind: ${{ needs.changes.outputs.kind }}

  # The only check the ruleset requires. Skipped jobs pass, so jobs can be added without touching
  # the ruleset: list every other job in needs.
  ci-result:
    name: CI result
    needs: [changes, build, changelog]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in success | skipped) ;; *) exit 1 ;; esac
          done
